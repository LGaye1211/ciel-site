  function askSend(question){
    if(ASK.busy||!question)return;
    var key=aiKey();
    if(!key){askReset();return;}

    askNote(esc(question).replace(/\n/g,'<br>'),'me');
    ASK.log.push({role:'user',content:question});

    var out=askNote('<span class="thinking"><i></i><i></i><i></i></span>','ai');
    ASK.busy=true;
    $('#askSend').disabled=true;
    ASK.ctrl=(typeof AbortController!=='undefined')?new AbortController():null;

    var text='',thinking=false,refused=false,painting=false;
    function paint(){
      if(painting)return;
      painting=true;
      requestAnimationFrame(function(){
        painting=false;
        out.innerHTML=text?md(text)
          :'<span class="thinking"><i></i><i></i><i></i></span>'+
           (thinking?' <span class="sub">working through the filings…</span>':'');
        askScroll();
      });
    }

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      signal:ASK.ctrl?ASK.ctrl.signal:undefined,
      headers:{
        'content-type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        // Anthropic blocks browser origins unless this is set. It permits the
        // request; it does not make holding a key in a browser safe.
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-opus-5',
        max_tokens:8000,
        thinking:{type:'adaptive'},
        output_config:{effort:'high'},
        system:askContext(),
        messages:ASK.log.map(function(m){return {role:m.role,content:m.content};}),
        stream:true
      })
    }).then(function(res){
      if(!res.ok){
        return res.text().then(function(body){
          var msg=body;
          try{msg=JSON.parse(body).error.message;}catch(e){}
          throw new Error(res.status===401
            ? 'The key was rejected (401). Check it in Settings.'
            : (res.status===429
              ? 'Rate limited (429). Wait a moment and ask again.'
              : res.status+' — '+msg));
        });
      }
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
      function pump(){
        return reader.read().then(function(chunk){
          if(chunk.done)return;
          buf+=dec.decode(chunk.value,{stream:true});
          var lines=buf.split('\n');
          buf=lines.pop();
          lines.forEach(function(line){
            if(line.indexOf('data:')!==0)return;
            var raw=line.slice(5).trim();
            if(!raw||raw==='[DONE]')return;
            var ev;try{ev=JSON.parse(raw);}catch(e){return;}
            if(ev.type==='content_block_start'&&ev.content_block&&
               ev.content_block.type==='thinking'){thinking=true;paint();}
            else if(ev.type==='content_block_delta'&&ev.delta){
              if(ev.delta.type==='text_delta'&&ev.delta.text){text+=ev.delta.text;paint();}
              else if(ev.delta.type==='thinking_delta'){thinking=true;paint();}
            }
            else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason==='refusal'){
              refused=true;
            }
            else if(ev.type==='error'){
              throw new Error((ev.error&&ev.error.message)||'stream error');
            }
          });
          return pump();
        });
      }
      return pump();
    }).then(function(){
      // A refusal carries no content, so reading the empty block as an answer
      // would render a blank bubble and look like a bug.
      if(refused){
        out.className='msg err';
        out.innerHTML='Claude declined to answer that one. Rephrase it and try again.';
      }else if(!text){
        out.className='msg err';
        out.innerHTML='Empty response. Ask again.';
      }else{
        out.innerHTML=md(text);
        ASK.log.push({role:'assistant',content:text});
      }
      askScroll();
    }).catch(function(err){
      if(err&&err.name==='AbortError')return;
      out.className='msg err';
      out.innerHTML=esc(err.message||'Request failed.');
      // Drop the question that never got an answer, so a retry does not send
      // the same turn twice.
      ASK.log.pop();
      askScroll();
    }).then(function(){
      ASK.busy=false;ASK.ctrl=null;
      var send=$('#askSend');if(send)send.disabled=false;
    });
  }

  (function bindAsk(){
    var fab=$('#askFab'),sheet=$('#askSheet'),input=$('#askInput');
    fab.innerHTML=svg('chat')+'<span>Ask</span>';
    $('#askIc').innerHTML=svg('chat');
    $('#askClose').innerHTML=svg('close');
    $('#askSend').innerHTML=svg('send');
    fab.addEventListener('click',askOpen);
    $('#askClose').addEventListener('click',askClose);
    $('#askScrim').addEventListener('click',askClose);
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&sheet.classList.contains('on'))askClose();});
    $('#askChips').addEventListener('click',function(e){
      var b=e.target.closest('.askchip');if(!b)return;
      var set=ASK.company?CHIPS_COMPANY:CHIPS_QUEUE;
      askSend(set[parseInt(b.getAttribute('data-i'),10)][1]);
    });
    $('#askForm').addEventListener('submit',function(e){
      e.preventDefault();
      var q=input.value.trim();
      if(!q)return;
      input.value='';input.style.height='';
      askSend(q);
    });
    input.addEventListener('input',function(){
      this.style.height='';this.style.height=Math.min(this.scrollHeight,132)+'px';});
    // Enter sends on a desktop keyboard; on a phone Enter has to stay a newline
    // or the on-screen return key becomes unusable.
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=900){
        e.preventDefault();$('#askForm').dispatchEvent(new Event('submit',{cancelable:true}));
      }
    });
    askBody().addEventListener('click',function(e){
      if(e.target.closest('#askToSettings'))askClose();});
  })();

  /* ── ROUTER ─────────────────────────────────────────── */
  function route(){
    var hash=location.hash||'#/';
    var view=$('#view');
    if(hash==='#/settings'){
      view.innerHTML=renderSettings();
      $('#ghSave').addEventListener('click',function(){
        ghSave({repo:$('#ghRepo').value.trim(),token:$('#ghToken').value.trim()});
        flushPending();
        this.textContent='Saved';
      });
      $('#aiSaveBtn').addEventListener('click',function(){
        aiSaveKey($('#aiKey').value.trim());
        askReset();
        this.textContent='Saved';
      });
      hydrate();window.scrollTo(0,0);return;
    }
    if(hash.indexOf('#/c/')===0){
      var slug=hash.slice(4);
      view.innerHTML='<div class="empty">Loading '+esc(slug)+'…</div>';
      fetch(DATA+'companies/'+encodeURIComponent(slug)+'.json?v='+
            encodeURIComponent((M&&M.generated_at)||''))
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
        .then(function(d){view.innerHTML=renderDossier(d);bindDossier(d);hydrate();
          askSetCompany(d);window.scrollTo(0,0);})
        .catch(function(err){view.innerHTML='<div class="empty"><b>Could not load that dossier.</b>'+
          'data/sleeve/companies/'+esc(slug)+'.json — '+esc(err.message)+'</div>';});
      return;
    }
    askSetCompany(null);
    if(hash==='#/review'){view.innerHTML=renderReview();hydrate();window.scrollTo(0,0);return;}
    view.innerHTML=charterBand()+renderQueue()+baseRateSection()+renderCoverage();
    var sb=$('#stripBtn');
    if(sb)sb.addEventListener('click',function(){
      var more=$('#stripMore'),open=more.hidden;
      more.hidden=!open;this.setAttribute('aria-expanded',String(open));
      this.classList.toggle('open',open);
    });
    var why=$('#whyBtn');
    if(why)why.addEventListener('click',function(){
      var box=$('#whyBox');box.hidden=!box.hidden;
      this.textContent=box.hidden?'Why were they eliminated?':'Hide';});
    document.querySelectorAll('.qrow').forEach(function(b){
      b.addEventListener('click',function(){location.hash='#/c/'+b.getAttribute('data-slug');});
    });
    hydrate();
  }

  function bindDossier(d){
    var conf=$('#conf'),chosen=(POS[d.slug]&&POS[d.slug].confidence)||null;
    if(conf)conf.addEventListener('click',function(e){
      var b=e.target.closest('button[data-c]');if(!b)return;
      chosen=parseInt(b.getAttribute('data-c'),10);
      conf.querySelectorAll('button').forEach(function(x){
        x.setAttribute('aria-pressed',x===b?'true':'false');});
      var w=$('#confWarn');if(w)w.hidden=true;
    });
    var btn=$('#acceptBtn');
    if(btn)btn.addEventListener('click',function(){
      if(!chosen){var w=$('#confWarn');if(w)w.hidden=false;return;}
      var record={
        slug:d.slug,name:d.name,ticker:d.ticker,cik:d.cik,
        confidence:chosen,
        accepted_at:new Date().toISOString(),
        accepted_score:(d.score&&d.score.total)||null,
        accepted_cohort:(L&&L.cohort)||'',
        rubric_version:(d.score&&d.score.rubric_version)||'',
        // Store what the app argued at the time. A year on, the review replays
        // this against what actually happened - Appendix B's retrospective,
        // without you having had to write anything.
        argued_for:(d.bull||[]).map(function(e){return e.text;}),
        argued_against:(d.bear||[]).map(function(e){return e.text;}),
        metrics_at_accept:d.metrics||{},
        triggers:d.triggers||[],
        pre_cleared:false
      };
      POS[d.slug]=record;
      savePos();

      var path='charter/positions/'+d.slug+'.json';
      var msg='sleeve: accept '+d.name+' (confidence '+chosen+'/5)';
      if(ghConfig()){
        ghPut(path,record,msg).catch(function(){queuePending({path:path,payload:record,message:msg});});
      }else{
        queuePending({path:path,payload:record,message:msg});
      }
      location.hash='#/';
    });
  }

  window.addEventListener('hashchange',route);

  /* ── BOOT ───────────────────────────────────────────── */
  if(location.protocol==='file:'){
    $('#view').innerHTML='<div class="empty"><b>This page needs a web server.</b>'+
      'It reads its data with fetch(), which browsers block on file:// URLs.'+
      '<code>python3 -m http.server 8000</code><br><span style="font-size:11px">'+
      'then open http://localhost:8000/sleeve.html</span></div>';
    $('#askFab').style.display='none';
    return;
  }

  Promise.all([
    fetch(DATA+'manifest.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(DATA+'latest.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('charter/charter.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('scanner/config/costs.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    M=res[0];L=res[1];CHARTER=res[2];COSTS=res[3];
    flushPending();
    if(!L){
      $('#view').innerHTML='<div class="empty"><b>No scan data yet.</b>'+
        'Run the scanner to produce data/sleeve/latest.json.'+
        '<code>python3 scanner/run.py --mode deep</code></div>';
      return;
    }
    if(M&&M.schema_version&&M.schema_version.split('.')[0]!=='1'){
      $('#view').innerHTML='<div class="empty"><b>This page is older than the data.</b>'+
        'Hard refresh to pick up the current version.</div>';
      return;
    }
    renderPills();
    route();
  });
})();
</script>
