name: Sleeve — weekly refresh

# This job exists for two reasons. It re-tests every armed sell trigger against
# newly filed data, and it always bumps manifest.heartbeat.
#
# The heartbeat is not decorative. GitHub disables scheduled workflows in public
# repositories after 60 days without a commit, and only a commit resets that
# timer. A quarterly cron on its own would be switched off before it ever fired
# a second time. This weekly commit keeps it alive.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleeve-scan
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore scan cache
        uses: actions/cache@v4
        with:
          path: scanner/.cache
          key: sleeve-cache-${{ github.run_id }}
          restore-keys: |
            sleeve-cache-

      - name: Self-test
        run: python -m unittest discover -s scanner/tests -t .

      - name: Light scan
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner/run.py --mode light

      - name: Verify output
        run: python scanner/verify.py

      - name: Commit (always — this is the keepalive)
        run: |
          git config user.name  "ciel-scanner"
          git config user.email "actions@github.com"
          git add data/sleeve
          git commit -m "sleeve: weekly refresh $(date -u +%Y-%m-%d)" || echo "nothing staged"
          git push || true
