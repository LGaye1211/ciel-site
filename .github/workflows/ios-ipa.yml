name: iOS — build unsigned .ipa

# Produces an unsigned .ipa on a macOS runner (free for public repos, Xcode
# preinstalled) and attaches it to a release, so it can be downloaded straight
# onto the phone and re-signed at install time by Sideloadly or AltStore.
#
# The app is a WKWebView pointed at the live GitHub Pages URL rather than a
# bundled copy of the site. That means each scanner commit reaches the phone
# with no rebuild — otherwise every quarterly scan would need a new .ipa and a
# fresh sideload. Build once; the content stays live.

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  build:
    # macos-14 ships Xcode 15.4, whose iOS SDK is two majors behind the phone
    # this targets. macos-15 carries Xcode 16, and project.yml pins the project
    # format low enough that either runner can read what XcodeGen writes.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        # Both versions, because the failure that cost a build was a mismatch
        # between them: an unpinned XcodeGen wrote a project format the pinned
        # Xcode could not open. Neither version alone would have shown it.
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Generate the Xcode project
        # The project is generated from ios/CielSleeve/project.yml rather than
        # committed as a .pbxproj: that format is unreadable in review, merges
        # badly, and cannot be sanity-checked without a Mac.
        run: |
          brew install xcodegen
          xcodegen --version
          cd ios/CielSleeve && xcodegen generate
          # Printed so a scheme mismatch is obvious in the log rather than
          # surfacing as an opaque "scheme not found" from xcodebuild.
          xcodebuild -list -project CielSleeve.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/CielSleeve/CielSleeve.xcodeproj \
            -scheme CielSleeve \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        # -exportArchive is deliberately not used: it insists on a signing
        # configuration. Zipping the .app under Payload/ is the standard way to
        # produce a valid unsigned .ipa, and it is exactly the input the
        # sideloading tools expect for re-signing.
        run: |
          APP="build/Build/Products/Release-iphoneos/CielSleeve.app"
          test -d "$APP" || { echo "no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CielSleeve-unsigned.ipa Payload
          ls -lh CielSleeve-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CielSleeve-unsigned-ipa
          path: CielSleeve-unsigned.ipa
          retention-days: 90

      # Published as a release rather than only as a workflow artifact: an
      # artifact is a login-gated zip, which is painful to get onto a phone. A
      # release asset is a direct download link.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          name: CIEL Sleeve — unsigned iOS build
          files: CielSleeve-unsigned.ipa
          body: |
            Unsigned build of the CIEL learning-sleeve terminal.

            **This file cannot be installed as-is.** iOS refuses unsigned apps,
            so it has to be re-signed with your own Apple ID first:

            - **From a computer** — Sideloadly (Windows/macOS) or AltStore.
            - **From the phone alone** — an on-device signer such as ESign or
              Feather, using your own free Apple ID.

            A free Apple ID gives a 7-day certificate and needs refreshing; a
            paid developer account gives a year. That is iOS, not this build.

            The app is a WKWebView pointed at the live site, so every scanner
            update arrives without rebuilding or re-installing this.
