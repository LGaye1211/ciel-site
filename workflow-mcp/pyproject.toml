[project]
name = "wfmcp"
version = "0.1.0"
description = "A small, flexible workflow engine exposed as an MCP server, with MS Teams notifications."
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
wfmcp = "wfmcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wfmcp*"]
