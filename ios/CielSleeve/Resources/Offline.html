<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#070d18;color:#eef3fc;
    font-family:-apple-system,system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;
  }
  @media (prefers-color-scheme: light){
    body{background:#eaeef4;color:#0f1d30}
    .sub{color:#68758c!important}
  }
  .mark{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.16em;
    font-size:13px;color:#cbb078;margin-bottom:20px}
  h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
  .sub{font-size:13px;line-height:1.6;color:#7182a0;max-width:300px}
  .hint{font-size:11.5px;line-height:1.6;color:#48566f;margin-top:20px;max-width:300px}
</style>
</head>
<body>
  <div>
    <div class="mark">CIEL · SLEEVE</div>
    <h1>No connection</h1>
    <p class="sub">The terminal reads its data from the live site, so it needs a network to load.</p>
    <p class="hint">Pull down to retry. Nothing you have accepted is lost — positions are stored on the device.</p>
  </div>
</body>
</html>
