# XcodeGen spec. Generates CielSleeve.xcodeproj at build time.
#
# A generated project rather than a committed .pbxproj: the binary plist format
# is unreadable in review, merges badly, and cannot be sanity-checked without a
# Mac. This file is the whole app definition and fits on a screen.

name: CielSleeve
options:
  bundleIdPrefix: com.ciel
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
  # Pinned deliberately. XcodeGen is installed unpinned from Homebrew, and its
  # default moved to `xcode16_0` - object format 77 - which Xcode 15.4 on the
  # macos-14 runner cannot open at all: "the project is in a future Xcode
  # project file format (77)". The build died before compiling a single line.
  # A floating generator writing for a pinned toolchain will break again the
  # next time either end moves, so the format is stated here rather than
  # inherited. Xcode 16 reads this format; Xcode 15 reads only this one.
  projectFormat: xcode15_0

settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_BITCODE: NO
    # Signing is left off entirely: the release artefact is an unsigned .ipa,
    # re-signed at install time by the sideloading tool.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ''

targets:
  CielSleeve:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      # Generated by XcodeGen, and deliberately NOT under Resources/. That
      # directory is declared above as the Copy Bundle Resources phase, so a
      # plist written into it gets both processed as the target's Info.plist
      # and copied as an ordinary resource - two commands producing the same
      # output file, which Xcode refuses outright:
      #   error: Multiple commands produce '.../CielSleeve.app/Info.plist'
      path: Info.plist
      properties:
        CFBundleDisplayName: CIEL Sleeve
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        # Declared explicitly and matched by SceneDelegate.swift. Generating a
        # scene manifest without a scene delegate makes UIKit ignore
        # AppDelegate.window, which launches to a black screen rather than
        # failing the build.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # No ATS exception needed: GitHub Pages is HTTPS.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ciel.sleeve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Declared explicitly: XcodeGen does not create schemes unless asked, and
# xcodebuild -scheme CielSleeve would fail with "scheme not found". Defining it
# here rather than as a target-level `scheme:` avoids generating two.
schemes:
  CielSleeve:
    build:
      targets:
        CielSleeve: all
    run:
      config: Release
    archive:
      config: Release
